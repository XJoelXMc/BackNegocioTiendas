spring.application.name=mi-negocio
# =========================
# SERVER
# =========================
server.port=9080

# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/minegocio
spring.datasource.username=postgres
spring.datasource.password=5432
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema comes from the SQL script, so Hibernate must not create or alter it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# =========================
# CLOUDINARY
# =========================
cloudinary.cloud-name=dah1xbwik
cloudinary.api-key=381436488427848
cloudinary.api-secret=FhYsLVfZmkf5uHTssHzFpbOHFvo
logging.level.org.springframework.security=DEBUG
# =========================
# MULTIPART FIX 
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true
# =========================
# =========================
# JWT
# =========================
# Key must have at least 64 characters (HS512).
# In production set the JWT_SECRET_KEY environment variable. The default is for development only.
jwt.secret.key=${JWT_SECRET_KEY:dev-only-mi-negocio-secret-key-change-me-in-production-0123456789abcdef}
# 24 hours in milliseconds
jwt.time.expiration=86400000

# =========================
